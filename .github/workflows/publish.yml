name: Đăng gói
# Gắn tag vX.Y.Z → đăng npm (trusted publishing, có provenance) và PyPI (trusted publishing). Không cần token trong repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: hashFiles('js/package.json') != ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest
      - run: npm install --no-save
      - run: npm test
      - run: npm publish --provenance --access public
  pypi:
    if: hashFiles('python/pyproject.toml') != ''
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
